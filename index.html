<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6E46FF">
<title>easier motivation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Azeret+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6E46FF; --purple-light:#8C71FF; --purple-lightest:#E6DFFF; --purple-dark:#2B1E32;
  --yellow:#FFC74C; --yellow-lightest:#FFFCDE; --green:#46FF88; --green-lightest:#E4FCDE; --green-darker:#085B3C;
  --blue:#0694FF; --red:#FA2D7F; --pink:#C208FF; --orange:#FF701B;
  --grey:#D1D1D1; --grey-dark:#313131; --grey-lightest:#FAFAFC; --soft:#F5F5F7;
  --fg:#121417; --fg-muted:#5A5D63; --bg:#fff; --border:#D1D1D1;
  --aurora:
    radial-gradient(60% 80% at 20% 30%, #FA2D7F33 0%, transparent 60%),
    radial-gradient(70% 80% at 80% 70%, #6E46FFAA 0%, transparent 65%),
    linear-gradient(135deg, #A68EFF 0%, #6E46FF 60%, #2B1E32 100%);
  --font:'Poppins',system-ui,-apple-system,sans-serif;
  --mono:'Azeret Mono',ui-monospace,Menlo,monospace;
  --r-l:24px; --r-pill:9999px;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--font);font-size:17px;line-height:1.5;color:var(--fg);-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 64px}

header{background:var(--aurora);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px}
header .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand img{width:30px;height:30px;display:block}
.brand span{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand span b{font-weight:400;opacity:.85}
.iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;width:36px;height:36px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}

.panel{display:none}
.panel.on{display:block;animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 14px;background:none;border:none;padding:0;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}
h1.q{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:26px 0 14px}
h2.t{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2.t svg{width:26px;height:26px;flex:0 0 26px;color:var(--purple)}
p.lede{font-size:16px;line-height:1.5;margin:0 0 20px;color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:var(--r-pill);border:1px solid transparent;cursor:pointer;white-space:nowrap;font-size:13px;padding:10px 18px;transition:background .2s var(--ease),border-color .2s var(--ease),transform .14s var(--ease)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:var(--purple-light)}
.btn-ghost{background:#fff;border-color:var(--grey-dark);color:var(--grey-dark)}
.btn-white{background:#fff;color:var(--purple)}
.btn-lg{font-size:15px;padding:14px 26px}
.btn[disabled]{opacity:.45;cursor:default}

.causes{display:flex;flex-direction:column;gap:10px}
.cause{width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:var(--r-l);padding:14px 16px;cursor:pointer;font-size:16px;font-weight:500;color:var(--fg);line-height:1.3;display:flex;align-items:center;gap:14px;transition:border-color .2s var(--ease),background .2s var(--ease),transform .14s var(--ease)}
.cause:hover{border-color:var(--purple);background:var(--grey-lightest)}
.cause:active{transform:translateY(1px) scale(.995)}
.cause .ic{width:40px;height:40px;border-radius:12px;background:var(--purple-lightest);color:var(--purple);display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px}
.cause .ic svg{width:22px;height:22px}
.cause.emo .ic{background:var(--yellow-lightest);color:var(--orange)}

.packwrap{margin:26px 0 0;background:var(--aurora);border-radius:var(--r-l);padding:22px 20px 20px;color:#fff;text-align:center}
.packwrap p{margin:0 0 16px;font-size:15px;color:#E6DFFF}
.pack{position:relative;width:150px;height:96px;margin:0 auto 18px;cursor:pointer}
.pack .pc{position:absolute;inset:0;border-radius:16px;background:#fff;border:1px solid rgba(110,70,255,.25);box-shadow:none;transition:transform .35s var(--ease)}
.pack .pc:nth-child(1){transform:translate(-6px,6px) rotate(-3deg);opacity:.75}
.pack .pc:nth-child(2){transform:translate(3px,3px) rotate(2deg);opacity:.88}
.pack .pc:nth-child(3){transform:none}
.pack .pc:nth-child(3)::after{content:'';position:absolute;inset:10px;border-radius:10px;background:repeating-linear-gradient(135deg,#E6DFFF 0 6px,#fff 6px 12px)}
.pack:hover .pc:nth-child(3){transform:translateY(-4px)}
.pack:active .pc:nth-child(3){transform:translateY(-2px) scale(.98)}

.stage{position:relative;min-height:230px;margin:6px 0 0}
.drawn{position:relative;border-radius:var(--r-l);padding:3px;overflow:hidden;animation:draw .55s var(--ease)}
.drawn::before{content:'';position:absolute;left:50%;top:50%;width:200%;padding-top:200%;margin:-100% 0 0 -100%;background:conic-gradient(from 0deg,transparent 0 55%,#fff 62%,transparent 70%);animation:spin 2.6s linear infinite;opacity:.9}
.drawn .face{position:relative;background:var(--aurora);color:#fff;border-radius:21px;padding:30px 24px 22px;min-height:224px;display:flex;flex-direction:column;justify-content:center}
.drawn .tag{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#E6DFFF;margin:0 0 10px}
.drawn .title{font-size:23px;font-weight:600;line-height:1.22;margin:0;text-wrap:balance}
.drawn .detail{font-size:15px;line-height:1.45;margin:12px 0 0;color:#EDE7FF}
.drawn .meta{font-family:var(--mono);font-size:11px;color:#C9BBFF;margin:14px 0 0;letter-spacing:.06em}
@keyframes draw{0%{opacity:0;transform:translateY(40px) rotate(-4deg) scale(.92)}60%{opacity:1;transform:translateY(-6px) rotate(1deg) scale(1.01)}100%{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rate{display:flex;gap:10px;margin:14px 0 0}
.rate .btn{flex:1}
.after{display:flex;gap:10px;margin:14px 0 0;align-items:center;justify-content:space-between}
.after .note{font-size:14px;color:var(--fg-muted)}
.stage .btn-lg{margin-top:14px}
.centre{text-align:center}
.mt{margin-top:16px}

.note-card{background:var(--soft);border-radius:var(--r-l);padding:14px 16px;margin:14px 0 0;font-size:15px;line-height:1.45;color:var(--fg)}

.lever{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--border)}
.lever:first-of-type{border-top:none}
.lever label{font-size:16px;font-weight:500}
.lever .sub{font-size:14px;color:var(--fg-muted)}
.lever input[type=range]{width:100%;accent-color:var(--purple);margin:4px 0 0}
.lever .val{font-family:var(--mono);font-size:12px;color:var(--purple);text-align:right}
.danger{margin-top:26px}
.danger .btn{border-color:var(--red);color:var(--red)}

@media(max-width:380px){h1.q{font-size:22px}h2.t{font-size:22px}.drawn .title{font-size:21px}}
</style>
</head>
<body>

<header><div class="inner">
  <a class="brand" href="#" data-go="home"><img src="logo.png" alt=""><span>easier <b>motivation</b></span></a>
  <button class="iconbtn" data-go="tune" aria-label="Tune what moves you">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </button>
</div></header>

<div class="wrap">

<section class="panel on" id="p-home">
  <h1 class="q">What's stopping you?</h1>
  <div class="causes" id="cause-list"></div>

  <div class="packwrap">
    <p>Or skip the diagnosis and draw one.</p>
    <div class="pack" id="home-pack" role="button" aria-label="Draw a card"><div class="pc"></div><div class="pc"></div><div class="pc"></div></div>
    <button class="btn btn-white btn-lg" id="home-draw">Draw a card</button>
    <div class="stage" id="home-stage" style="display:none"></div>
  </div>
</section>

<section class="panel" id="p-cause">
  <button class="back" data-go="home">← Back</button>
  <h2 class="t" id="cause-title"></h2>
  <p class="lede" id="cause-lede"></p>
  <div class="centre">
    <div class="pack" id="cause-pack" role="button" aria-label="Draw a card"><div class="pc"></div><div class="pc"></div><div class="pc"></div></div>
    <button class="btn btn-purple btn-lg" id="cause-draw">Draw a card</button>
  </div>
  <div class="stage" id="cause-stage" style="display:none"></div>
</section>

<section class="panel" id="p-tune">
  <button class="back" data-go="home">← Back</button>
  <h2 class="t">What moves you</h2>
  <p class="lede">Every card pulls one of these six levers. Set how well each one works for you and the deck will favour the ones that do. Rating cards adjusts this on its own over time.</p>
  <div id="levers"></div>
  <div class="danger"><button class="btn btn-ghost" id="reset">Reset ratings and levers</button></div>
</section>

</div>

<script>
(function(){
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem('em:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem('em:'+k, JSON.stringify(v)); }catch(e){} }
};

var CAUSES = [
  { id:'start', label:"I don't know where to start", emo:false,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="19" r="2"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><path d="M7 18c6 0 4-10 11-9"/></svg>',
    lede:"You're not sure how to do it well, or what the first step is. An unclear task reads as a risky one, so it gets put off. Make the first step small and obvious and the rest usually follows." },
  { id:'boring', label:"It's boring", emo:false,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 15h8"/><path d="M9 9h.01M15 9h.01"/></svg>',
    lede:"There's nothing in the task that you want. Most advice assumes a task being important is enough to start you. For most people with ADHD it isn't. Add something you do want, or hand the task to someone who doesn't mind it." },
  { id:'nodeadline', label:"Nothing happens if I skip it today", emo:false,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    lede:"Nothing bad happens if you leave it until tomorrow, so it loses to whatever is happening now. A distant payoff barely registers. Bring the consequence closer, usually by involving another person." },
  { id:'pulled', label:"I keep getting pulled to something else", emo:false,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 3h4v5H6zM14 3h4v5h-4z"/></svg>',
    lede:"The task can't compete with whatever is one click away. That's not weak willpower. It's what attention does when the task is dull and the distraction is bright. Make the distraction harder to reach." },
  { id:'dread', label:"I'm dreading it", emo:true,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    lede:"You're imagining being judged, and the imagining is worse than the event will be. Worry about a call or a message runs in the background and can take most of a day. Make what will actually happen concrete, then act before the worry can build." },
  { id:'late', label:"I'm already late and I feel bad about it", emo:true,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    lede:"You're late, and feeling bad about it is now blocking you more than the task is. Shame stops movement. Send the update, then treat the work and the feeling as two separate jobs." }
];

var LEVERS = [
  { id:'person',    label:'Another person expecting it',      sub:'Telling someone, booking a call, working alongside them' },
  { id:'structure', label:'Changing the shape of the task',    sub:'Smaller steps, a timer, a different format' },
  { id:'place',     label:'Changing where I am',               sub:'Different room, phone away, one window open' },
  { id:'reward',    label:'Something in it for me',            sub:'A reward at the end, or money on the line' },
  { id:'thinking',  label:'Changing how I think about it',     sub:'Naming the fear, checking the standard, the friend test' },
  { id:'body',      label:'Coffee, meds, movement',            sub:'Chemistry and physical state' }
];

var DEFAULT_PROFILE = { person:1.0, structure:0.8, place:0.7, reward:0.6, thinking:0.5, body:0.6 };

var STRATEGIES = [
  { id:'s1', cause:'start', lever:'structure', title:"Write down the first physical action.", detail:"Not \"do the report\". \"Open the doc and type the heading.\"" },
  { id:'s2', cause:'start', lever:'structure', title:"Spend ten minutes listing what you'd need to know before you could start.", detail:"That list is the actual task. Start on the first item." },
  { id:'s3', cause:'start', lever:'structure', title:"Make the worst version on purpose.", detail:"A bad draft you can fix beats a good one you never begin." },
  { id:'s4', cause:'start', lever:'person', title:"Ask someone who's done this what their first hour looked like.", detail:"Not how to do it. What they did first." },
  { id:'s5', cause:'start', lever:'structure', title:"Open the last one you did and change it.", detail:"Copying beats inventing." },
  { id:'s6', cause:'start', lever:'structure', title:"Say out loud what \"finished\" looks like.", detail:"If you can't, that's what to figure out first." },
  { id:'s7', cause:'start', lever:'person', title:"Hand off the part you don't know how to do. Keep the part you do.", detail:"" },
  { id:'s8', cause:'start', lever:'thinking', title:"You haven't done this before, so of course it's unclear.", detail:"That's a fact about the task, not about you." },

  { id:'b1', cause:'boring', lever:'reward', title:"Pair it with something you like, and only allow that thing while you do this.", detail:"A specific podcast. A specific drink. Only during this task." },
  { id:'b2', cause:'boring', lever:'structure', title:"Make it a race. How many can you clear in ten minutes?", detail:"Write the number down. Beat it next time." },
  { id:'b3', cause:'boring', lever:'structure', title:"Change the format.", detail:"If you've been typing, dictate it. If you've been sitting, stand." },
  { id:'b4', cause:'boring', lever:'reward', title:"Pick a reward and claim it the moment you finish.", detail:"Not later. The moment." },
  { id:'b5', cause:'boring', lever:'person', title:"Do it in a room with someone else who's also working.", detail:"Same room, or a video call with both cameras on." },
  { id:'b6', cause:'boring', lever:'person', title:"Hand it to someone else.", detail:"Boring and below your rate is the definition of what to delegate." },
  { id:'b7', cause:'boring', lever:'structure', title:"Put every boring task in one block and clear them together with music on.", detail:"" },
  { id:'b8', cause:'boring', lever:'structure', title:"Find the one part that isn't boring and start there.", detail:"" },

  { id:'n1', cause:'nodeadline', lever:'person', title:"Tell someone the time it'll be done today.", detail:"A message to a real person, not a note to yourself." },
  { id:'n2', cause:'nodeadline', lever:'person', title:"Book a call to hand it over.", detail:"Now the call is the deadline." },
  { id:'n3', cause:'nodeadline', lever:'reward', title:"Put money on it.", detail:"Tell a friend you'll pay them £20 if it isn't done by five." },
  { id:'n4', cause:'nodeadline', lever:'place', title:"Make it visible to someone else.", detail:"A whiteboard, a shared doc, a message in a channel." },
  { id:'n5', cause:'nodeadline', lever:'person', title:"Move the deadline yourself and tell the client.", detail:"\"You'll have it Tuesday\" is now a promise you have to keep." },
  { id:'n6', cause:'nodeadline', lever:'person', title:"Work alongside someone.", detail:"Their presence is a deadline you didn't have to invent." },
  { id:'n7', cause:'nodeadline', lever:'structure', title:"Set a 25-minute timer and stop when it rings.", detail:"A small deadline is still a deadline." },
  { id:'n8', cause:'nodeadline', lever:'thinking', title:"Ask what it costs to do this tomorrow instead.", detail:"If the honest answer is nothing, that's why it isn't moving. Change the answer." },

  { id:'p1', cause:'pulled', lever:'place', title:"Change rooms.", detail:"Different room, different pull." },
  { id:'p2', cause:'pulled', lever:'place', title:"Video off, music on.", detail:"Video wins your attention after about an hour whether you want it to or not." },
  { id:'p3', cause:'pulled', lever:'place', title:"Phone in a different room.", detail:"Not face down on the desk. A different room." },
  { id:'p4', cause:'pulled', lever:'place', title:"Close every window except the one you need.", detail:"" },
  { id:'p5', cause:'pulled', lever:'structure', title:"Write the distraction down and come back to it in 25 minutes.", detail:"Writing it down is usually enough to stop it looping." },
  { id:'p6', cause:'pulled', lever:'structure', title:"Do this before you open anything else.", detail:"Once email is open, email wins." },
  { id:'p7', cause:'pulled', lever:'body', title:"Take the meds or have the coffee, if it's that kind of day.", detail:"" },
  { id:'p8', cause:'pulled', lever:'place', title:"Full-screen the task.", detail:"A tab you can't see can't pull at you." },

  { id:'d1', cause:'dread', lever:'thinking', title:"Write down exactly what you think will happen. Then rate how likely it is, out of ten.", detail:"" },
  { id:'d2', cause:'dread', lever:'structure', title:"Write the agenda. Three things you want out of it.", detail:"Most of the dread is not knowing what will be asked of you." },
  { id:'d3', cause:'dread', lever:'structure', title:"Do the opposite of the urge.", detail:"The urge says wait until it's ready. Send it now." },
  { id:'d4', cause:'dread', lever:'structure', title:"Send three in a row with no gap between them.", detail:"The gap is where you reconsider." },
  { id:'d5', cause:'dread', lever:'structure', title:"Give the worry a time slot.", detail:"Ten minutes at four o'clock. Outside that window it can wait." },
  { id:'d6', cause:'dread', lever:'thinking', title:"Ask what you'd say to a friend in this exact position.", detail:"Then take your own advice." },
  { id:'d7', cause:'dread', lever:'thinking', title:"Think about the last time you dreaded something like this. What actually happened?", detail:"" },
  { id:'d8', cause:'dread', lever:'structure', title:"Make the exposure smaller.", detail:"A message before a call. A call before a meeting. One before three." },
  { id:'d9', cause:'dread', lever:'thinking', title:"Name what you're actually afraid of.", detail:"Being told no, or being thought less of by someone who won't change their mind? They need different responses." },

  { id:'l1', cause:'late', lever:'person', title:"Send an update, not an apology.", detail:"One line: \"This is landing Tuesday.\" They already know it's late. Now they know when it arrives." },
  { id:'l2', cause:'late', lever:'thinking', title:"Say what happened as an action.", detail:"\"I'm two days late\" is true. \"I'm useless\" is a verdict, and it's wrong." },
  { id:'l3', cause:'late', lever:'thinking', title:"Ask what you'd think of a supplier you like who did the same thing.", detail:"That's the fair answer. It applies to you." },
  { id:'l4', cause:'late', lever:'thinking', title:"Being chased costs the relationship more than being late does.", detail:"Get ahead of the chase." },
  { id:'l5', cause:'late', lever:'structure', title:"Do fifteen minutes right now.", detail:"Shame drops as soon as you're moving." },
  { id:'l6', cause:'late', lever:'structure', title:"Fix the task first. Handle the feeling after.", detail:"Not both at once." },
  { id:'l7', cause:'late', lever:'thinking', title:"If you're working out how guilty you should feel, stop.", detail:"That question has no answer. The task does." },
  { id:'l8', cause:'late', lever:'thinking', title:"Check whether it's actually late, or late by a standard you'd never apply to anyone else.", detail:"" }
];

var profile = Object.assign({}, DEFAULT_PROFILE, store.get('profile', {}));
var ratings = store.get('ratings', {});
var lastDrawn = { home:null, cause:null };
var currentCause = null;

function weightOf(s){
  var base = profile[s.lever] || 0.5;
  var r = ratings[s.id] || {up:0, down:0};
  var adj = 1 + (r.up * 0.35) - (r.down * 0.25);
  return Math.max(0.08, base * adj);
}
function pick(list, avoidId){
  var pool = list.filter(function(s){ return s.id !== avoidId; });
  if(!pool.length) pool = list;
  var total = pool.reduce(function(a,s){ return a + weightOf(s); }, 0);
  var r = Math.random() * total;
  for(var i=0;i<pool.length;i++){ r -= weightOf(pool[i]); if(r <= 0) return pool[i]; }
  return pool[pool.length-1];
}
function causeById(id){ return CAUSES.filter(function(c){ return c.id===id; })[0]; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderCard(stage, s, showCause){
  var r = ratings[s.id] || {up:0, down:0};
  var meta = r.up ? ('worked ' + r.up + (r.up===1?' time':' times')) : '';
  var tag = showCause ? causeById(s.cause).label : LEVERS.filter(function(l){return l.id===s.lever;})[0].label;
  stage.style.display = 'block';
  stage.innerHTML =
    '<div class="drawn"><div class="face">' +
      '<p class="tag">' + esc(tag) + '</p>' +
      '<p class="title">' + esc(s.title) + '</p>' +
      (s.detail ? '<p class="detail">' + esc(s.detail) + '</p>' : '') +
      (meta ? '<p class="meta">' + meta + '</p>' : '') +
    '</div></div>' +
    '<div class="rate">' +
      '<button class="btn btn-purple" data-rate="up">This worked</button>' +
      '<button class="btn btn-ghost" data-rate="down">Didn\'t help</button>' +
    '</div>';
  stage.querySelectorAll('[data-rate]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.getAttribute('data-rate');
      ratings[s.id] = ratings[s.id] || {up:0, down:0};
      ratings[s.id][k]++;
      store.set('ratings', ratings);
      stage.querySelector('.rate').outerHTML =
        '<div class="after"><span class="note">' + (k==='up' ? 'Noted. The deck will show this one more.' : 'Noted. The deck will show this one less.') + '</span></div>';
    });
  });
  stage.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function drawHome(){
  var s = pick(STRATEGIES, lastDrawn.home && lastDrawn.home.id);
  lastDrawn.home = s;
  renderCard(document.getElementById('home-stage'), s, true);
  document.getElementById('home-draw').textContent = 'Draw another';
}
function drawCause(){
  if(!currentCause) return;
  var list = STRATEGIES.filter(function(s){ return s.cause === currentCause.id; });
  var s = pick(list, lastDrawn.cause && lastDrawn.cause.id);
  lastDrawn.cause = s;
  renderCard(document.getElementById('cause-stage'), s, false);
  document.getElementById('cause-draw').textContent = 'Draw another';
}

function renderHome(){
  var host = document.getElementById('cause-list');
  host.innerHTML = CAUSES.map(function(c){
    return '<button class="cause' + (c.emo?' emo':'') + '" data-cause="' + c.id + '"><span class="ic">' + c.icon + '</span><span>' + esc(c.label) + '</span></button>';
  }).join('');
}
function openCause(id){
  currentCause = causeById(id);
  if(!currentCause) return show('home');
  document.getElementById('cause-title').innerHTML = currentCause.icon + '<span>' + esc(currentCause.label) + '</span>';
  document.getElementById('cause-lede').textContent = currentCause.lede;
  var st = document.getElementById('cause-stage'); st.style.display='none'; st.innerHTML='';
  document.getElementById('cause-draw').textContent = 'Draw a card';
  lastDrawn.cause = null;
  show('cause');
}
function renderTune(){
  var host = document.getElementById('levers');
  host.innerHTML = LEVERS.map(function(l){
    var v = Math.round((profile[l.id]||0.5)*10);
    return '<div class="lever"><label for="lv-'+l.id+'">'+esc(l.label)+'</label><span class="sub">'+esc(l.sub)+'</span>' +
      '<input id="lv-'+l.id+'" type="range" min="1" max="10" value="'+v+'" data-lever="'+l.id+'"><span class="val" id="lvv-'+l.id+'">'+v+'/10</span></div>';
  }).join('');
  host.querySelectorAll('input[type=range]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var id = inp.getAttribute('data-lever'); var v = parseInt(inp.value,10);
      profile[id] = v/10; store.set('profile', profile);
      document.getElementById('lvv-'+id).textContent = v+'/10';
    });
  });
}

var panels = document.querySelectorAll('.panel');
function show(id){
  panels.forEach(function(p){ p.classList.remove('on'); });
  var el = document.getElementById('p-'+id); if(el) el.classList.add('on');
  window.scrollTo(0,0);
}
function route(){
  var h = location.hash.replace('#','');
  if(!h){ show('home'); return; }
  if(h==='tune'){ renderTune(); show('tune'); return; }
  if(causeById(h)){ openCause(h); return; }
  show('home');
}
document.addEventListener('click', function(e){
  var c = e.target.closest('[data-cause]');
  if(c){ location.hash = c.getAttribute('data-cause'); return; }
  var g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); var id = g.getAttribute('data-go'); location.hash = (id==='home') ? '' : id; if(id==='home') show('home'); return; }
});
window.addEventListener('hashchange', route);

document.getElementById('home-draw').addEventListener('click', drawHome);
document.getElementById('home-pack').addEventListener('click', drawHome);
document.getElementById('cause-draw').addEventListener('click', drawCause);
document.getElementById('cause-pack').addEventListener('click', drawCause);
document.getElementById('reset').addEventListener('click', function(){
  if(!confirm('Reset all ratings and lever settings?')) return;
  ratings = {}; profile = Object.assign({}, DEFAULT_PROFILE);
  store.set('ratings', ratings); store.set('profile', profile);
  renderTune();
});

renderHome();
route();
})();
</script>
</body>
</html>
